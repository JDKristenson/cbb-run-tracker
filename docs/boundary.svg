<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" role="img" aria-labelledby="title desc"><title id="title">CBB Run Tracker: static-page boundary</title><desc id="desc">The source contains only a static landing page. A browser renders it locally. Social and support links lead outside the repository. A bot, polling, alerts, and deployment are not established by this source. There is no implemented API flow in this map.</desc><rect width="1000" height="660" fill="#fff"/><g fill="#182333" font-family="sans-serif"><text x="40" y="48" font-size="28" font-weight="700">CBB Run Tracker</text><text x="40" y="78" font-size="18">Implemented page vs. unverified service claims</text><rect x="40" y="110" width="440" height="210" rx="12" fill="#f1f5f9" stroke="#52657c" /><text x="60" y="148" font-size="17" font-weight="700">SOURCE BOUNDARY</text><text x="60" y="186" font-size="19" >index.html + inline CSS</text><text x="60" y="224" font-size="19" >Static copy and illustrative alert</text><text x="60" y="262" font-size="19" >No scripts, APIs, or alert sender</text><rect x="520" y="110" width="440" height="210" rx="12" fill="#f1f5f9" stroke="#52657c" /><text x="540" y="148" font-size="17" font-weight="700">LOCAL VIEW</text><text x="540" y="186" font-size="19" >Open index.html in a browser</text><text x="540" y="224" font-size="19" >win-rate and alerts start as --</text><text x="540" y="262" font-size="19" >60s is literal text, not a timer</text><rect x="40" y="350" width="440" height="210" rx="12" fill="#fff8e8" stroke="#52657c" /><text x="60" y="388" font-size="17" font-weight="700">OUTSIDE THIS REPOSITORY</text><text x="60" y="426" font-size="19" >Social and support destinations</text><text x="60" y="464" font-size="19" >Links leave the static page</text><text x="60" y="502" font-size="19" >No account or payment needed to view</text><rect x="520" y="350" width="440" height="210" rx="12" fill="#fff8e8" stroke="#52657c" stroke-dasharray="8 5"/><text x="540" y="388" font-size="17" font-weight="700">UNVERIFIED EXTERNAL SERVICE</text><text x="540" y="426" font-size="19" >Polling, detection, and delivery</text><text x="540" y="464" font-size="19" >Selector compatibility is not identity</text><text x="540" y="502" font-size="19" >No execution or deployment established</text><text x="40" y="608" font-size="18">Read left to right: source renders locally; links leave the page.</text><text x="40" y="636" font-size="18">No arrow implies an implemented bot integration. Dashed box = unverified.</text></g></svg>
